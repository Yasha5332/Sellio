<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sellio Kinetic S Logo">
  <defs>
    <linearGradient id="ks-body" x1="8" y1="8" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B3BFF" />
      <stop offset="60%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#12161C" />
    </linearGradient>
    <linearGradient id="ks-arrow" x1="22" y1="28" x2="42" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B3BFF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#D4F56A" />
    </linearGradient>
    <linearGradient id="ks-handle" x1="16" y1="4" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4F56A" />
      <stop offset="100%" stop-color="#4B3BFF" />
    </linearGradient>
  </defs>

  <!-- Bag Handle -->
  <path d="M19 18V13C19 8.58172 22.5817 5 27 5C31.4183 5 35 8.58172 35 13V18" stroke="url(#ks-handle)" stroke-width="4" stroke-linecap="round"/>

