  <path d="M38 21H16C13.2386 21 11 23.2386 11 26V28C11 30.7614 13.2386 33 16 33H35C38.3137 33 41 35.6863 41 39V41C41 44.3137 38.3137 47 35 47H13" stroke="url(#ks-body)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Kinetic Surge Arrow -->
  <path d="M22 39L42 19M42 19H30M42 19V31" stroke="url(#ks-arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="64" y="44" fill="#12161C" font-family="'Bricolage Grotesque', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">Sellio</text>

  <!-- Pulse Dot -->
