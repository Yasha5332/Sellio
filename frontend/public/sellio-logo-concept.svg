<svg width="1100" height="300" viewBox="0 0 1100 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sellio wordmark logo</title>
  <desc id="desc">A creative Sellio wordmark with a teal and blue upward accent.</desc>
  <defs>
    <linearGradient id="sellioText" x1="130" y1="70" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12BFAE"/>
      <stop offset="0.48" stop-color="#1677E8"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="sellioAccent" x1="240" y1="240" x2="845" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C6B5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <text x="86" y="190" fill="url(#sellioText)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="150" font-weight="800" letter-spacing="-8">Sellio</text>

  <!-- Subtle upward sales motion built into the wordmark -->
  <path d="M160 232C255 256 405 260 548 224" stroke="url(#sellioAccent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M520 202L555 222L525 249" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
